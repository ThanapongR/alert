[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -O3

; ----------------------------------------------------
; Main Production Firmware (Inference + State Machine + MQTT)
; ----------------------------------------------------
[env:xiao_esp32s3]
build_src_filter = 
    +<*.cpp>
    -<tools/*>
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
lib_extra_dirs = lib

; ----------------------------------------------------
; In-situ Audio Data Collector (for edge-impulse-data-forwarder)
; ----------------------------------------------------
[env:data_collector]
build_src_filter = 
    +<tools/data_collector.cpp>
